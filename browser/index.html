<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@pmtx/chain in the browser</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0 auto; max-width: 960px; padding: 24px; font: 14px system-ui, sans-serif; background: #0f1115; color: #e6e8ee; }
    h1 { font-size: 20px; } h2 { font-size: 15px; margin-top: 28px; } h3 { font-size: 13px; }
    p.note { color: #8b93a7; }
    label { display: block; margin: 8px 0 4px; color: #8b93a7; }
    input[type=text], input[type=password], textarea { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px;
      border: 1px solid #2a2f3a; background: #171a21; color: inherit; font: 13px ui-monospace, Menlo, monospace; }
    textarea { height: 160px; }
    button { margin-top: 8px; padding: 8px 16px; border: 0; border-radius: 6px; background: #4a90fd; color: white; font-weight: 600; cursor: pointer; }
    .output { margin-top: 12px; white-space: pre-wrap; }
    a { color: #4a90fd; }
    table { border-collapse: collapse; font: 12px ui-monospace, Menlo, monospace; }
    th, td { border: 1px solid #2a2f3a; padding: 4px 8px; text-align: left; } th { background: #1f2430; }
  </style>
</head>
<body>
  <h1>@pmtx/chain in the browser</h1>
  <p class="note">Every request goes from this page straight to the platform. The token stays in this
    tab's memory. Do this for local or internal tools only: in a public site, keep the token on a server.</p>

  <label for="baseUrl">Backend URL</label>
  <input id="baseUrl" type="text" placeholder="https://api.prometheux.ai/jarvispy/<organization>/<username>">
  <label for="token">API token</label>
  <input id="token" type="password" autocomplete="off">

  <h2>Evaluate a program</h2>
  <textarea id="program" spellcheck="false">edge("Rome", "Milan").
edge("Milan", "Zurich").
edge("Zurich", "Paris").

reachable(X, Y) <- edge(X, Y).
reachable(X, Z) <- reachable(X, Y), edge(Y, Z).

@output("reachable").</textarea>
  <button id="evaluate">Evaluate</button>
  <div id="evaluateOutput" class="output"></div>

  <h2>Upload a file and download it back</h2>
  <input id="file" type="file">
  <button id="upload">Upload</button>
  <div id="fileOutput" class="output"></div>

  <script type="module" src="/dist/app.js"></script>
</body>
</html>
